</div</div></div><script>
let appData = {
secretKey: "zupu123",
familyTitle: "家族族谱",
memberList: []
};

function loadStorage() {
const raw = localStorage.getItem("gu_zupu_data");
if (raw) {
appData = JSON.parse(raw);
}
}

function saveLocal() {
localStorage.setItem("gu_zupu_data", JSON.stringify(appData));
alert("族谱数据已存档保存！");
}

function checkSecretKey() {
const inputVal = document.getElementById("passInput").value.trim();
if (inputVal === appData.secretKey) {
document.getElementById("lockModal").classList.add("hidden");
document.getElementById("mainApp").classList.remove("hidden");
renderFamilyTitle();
renderTree();
} else {
alert("秘钥错误，无法查阅族谱！");
}
}

function openKeySetting() {
const newK = prompt("请设置新的族谱访问秘钥", appData.secretKey);
if (newK && newK.trim()) {
appData.secretKey = newK.trim();
saveLocal();
alert("族谱访问秘钥修改成功，请妥善保管！");
}
}

function changeFamilyTitle() {
const val = document.getElementById("familyTitleInput").value.trim();
if (!val) {
alert("族谱名称不能为空！");
return;
}
appData.familyTitle = val;
saveLocal();
renderFamilyTitle();
alert(`已更新为【${val}】`);
}

function renderFamilyTitle() {
document.getElementById("familyTitle").textContent = appData.familyTitle || "家族族谱";
document.getElementById("familyTitleInput").value = appData.familyTitle || "";
document.title = appData.familyTitle + " - 古法族谱";
}

function getNewId() {
return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function addMember() {
document.getElementById("mName").value = "";
document.getElementById("mSpouse").value = "";
document.getElementById("mTitle").value = "";
document.getElementById("mFatherId").value = "";
document.getElementById("mLife").value = "";
document.getElementById("mRemark").value = "";
}

function submitMember() {
const name = document.getElementById("mName").value.trim();
if (!name) {
alert("族人姓名不能为空！");
return;
}
const obj = {
id: getNewId(),
name: name,
spouse: document.getElementById("mSpouse").value.trim(),
title: document.getElementById("mTitle").value.trim(),
fatherId: document.getElementById("mFatherId").value.trim(),
life: document.getElementById("mLife").value.trim(),
remark: document.getElementById("mRemark").value.trim()
};
appData.memberList.push(obj);
saveLocal();
renderTree();
alert(`族人录入成功！编号：${obj.id}`);
}

function renderTree() {
const container = document.getElementById("treeInner");
const roots = appData.memberList.filter(p => !p.fatherId);

function buildHtml(person) {
<div class="person-card">`;<div class="couple-box">`;
if (person.title) html += `<strong>【${person.title</strong>`;<strong</strong>`;
if (person.spouse) {
<span class="divider-heart"> 配</span>`;
<span>${person</span>`;
}
html</div>`;
if (person.l<div>生卒：${person.l</div>`;
if (person.remark<div>简介：${person.remark</div>`;
<div class="tip">谱系编号：${</div>`;
html += `</div>`;

const kids = appData.memberList.filter(k => k.fatherId === person.id);
if (kids.length > 0) {
<div class="children">`;
kids.forEach(child => {
html += buildHtml(child);
});
</div>`;
}
return html;
}

let allHtml = "";
roots.forEach(r => {
allHtml += buildHtml(r);
});

if (!allHtml) {
container.innerHTML = `<div class="tip" style="text-align:center;font-size:15px;padding:30px 0;">
始于始祖，<br/>
请录入家族始祖，续传世代谱系</div>`;
} else {
container.innerHTML = allHtml;
}
}

async function exportPdf() {
const { jsPDF } = window.jspdf;
const treeDom = document.getElementById("treeContainer");
alert("正在生成古法族谱PDF，请稍候...");
try {
const canvas = await html2canvas(treeDom, {
backgroundColor: "#f7efe0",
scale: 2,
useCORS: true,
logging: false
});
const imgData = canvas.toDataURL("image/jpeg", 1.0);
const pdf = new jsPDF("p", "mm", "a4");
const pageWidth = pdf.internal.pageSize.getWidth();
const pageHeight = pdf.internal.pageSize.getHeight();
const imgW = canvas.width;
const imgH = canvas.height;
const ratio = Math.min((pageWidth - 20) / imgW, (pageHeight - 20) / imgH);
pdf.addImage(imgData, "JPEG", 10, 10, imgW * ratio, imgH * ratio);
pdf.save(`${appData.familyTitle}.pdf`);
} catch (e) {
console.error(e);
alert("PDF导出失败，请检查网络链接！");
}
}

loadStorage();
