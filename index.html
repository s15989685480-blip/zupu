<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帅氏族谱 - 网页版</title>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "SimSun", "宋体", serif;
            background-color: #e8dfce;
            color: #2b1b0e;
            letter-spacing:1px;
            padding:16px 8px;
        }
        .container{
            max-width:1300px;
            margin:0 auto;
        }
        .book-paper {
            background-color: #f7efe0;
            box-shadow:0 4px 16px rgba(0,0,0,0.12);
            border:1px solid #c9b9a3;
            padding:32px 24px;
        }
        .lock-wrap {
            position:fixed;
            inset:0;
            background:rgba(20,12,6,0.75);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .lock-box{
            background:#f7efe0;
            border:2px solid #8b5a2b;
            width:90%;
            max-width:360px;
            padding:30px 20px;
            text-align:center;
        }
        .lock-box h2{
            margin-bottom:20px;
            color:#5a3819;
            font-weight:normal;
        }
        .lock-box input{
            width:100%;
            padding:10px;
            border:1px solid #b8976c;
            background:#fff9ee;
            margin-bottom:16px;
            font-size:16px;
        }
        .lock-box button{
            width:100%;
            padding:10px;
            background:#8b5a2b;
            color:#fff;
            border:none;
            cursor:pointer;
            font-size:16px;
        }
        .hidden{display:none !important;}

        header{
            text-align:center;
            padding-bottom:20px;
            margin-bottom:24px;
            border-bottom:1px double #8b5a2b;
        }
        h1#familyTitle{
            font-size:34px;
            letter-spacing:6px;
            font-weight:normal;
        }
        .sub-title{
            margin-top:8px;
            color:#70533b;
        }
        .title-edit-bar{
            margin-top:16px;
            display:flex;
            gap:8px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .title-edit-bar input{
            padding:7px 10px;
            border:1px solid #c2ac8e;
            background:#fff9ee;
        }
        .toolbar{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            justify-content:center;
            margin-bottom:24px;
        }
        .toolbar button{
            padding:8px 12px;
            border:1px solid #8b5a2b;
            background:transparent;
            cursor:pointer;
            font-family:inherit;
        }
        .toolbar button:hover{
            background:rgba(139,90,43,0.1);
        }
        .main-row{
            display:grid;
            grid-template-columns:1fr;
            gap:20px;
        }
        @media(min-width:900px){
            .main-row{
                grid-template-columns:300px 1fr;
            }
        }
        .form-card{
            background:rgba(255,249,238,0.6);
            border:1px solid #b8976c;
            padding:18px;
        }
        .form-card h3{
            margin-bottom:14px;
            padding-bottom:6px;
            border-bottom:1px solid #d4c2a8;
            font-weight:normal;
        }
        .form-item{
            margin-bottom:12px;
        }
        label{
            display:block;
            font-size:14px;
            margin-bottom:4px;
        }
        .form-card input{
            width:100%;
            padding:8px;
            border:1px solid #c2ac8e;
            background:#fffaf1;
        }
        .form-card button{
            width:100%;
            padding:9px;
            background:#8b5a2b;
            color:white;
            border:none;
            margin-top:6px;
            cursor:pointer;
        }
        .tree-wrap{
            min-height:550px;
            overflow-x:auto;
        }
        .person-card{
            border:1px solid #c9b9a3;
            background:rgba(255,246,230,0.35);
            padding:12px 16px;
            margin:6px 0;
        }
        .couple-box{
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap:wrap;
        }
        .couple-box strong{
            font-size:17px;
        }
        .divider-heart{
            color:#944;
        }
        .person-card div{
            margin-top:4px;
            font-size:14px;
        }
        .del-btn{
            margin-top:6px;
            font-size:12px;
            color:#b32424;
            cursor:pointer;
        }
        .children{
            margin-left:32px;
            border-left:1px dashed #8b5a2b;
            padding-left:16px;
        }
        .tip{
            font-size:12px;
            color:#66523c;
            margin-top:6px;
        }
    </style>
</head>
<body>
    <div class="lock-wrap" id="lockModal">
        <div class="lock-box">
            <h2>族谱访问验证</h2>
            <input type="password" id="passInput" placeholder="输入秘钥">
            <br>
            <button onclick="checkSecretKey()">进入族谱</button>
        </div>
    </div>

    <div class="container hidden" id="mainApp">
        <div class="book-paper">
            <header>
                <h1 id="familyTitle">帅氏族谱</h1>
                <div class="sub-title">木本水源 慎终追远 世代绵延</div>
                <div class="title-edit-bar">
                    <input id="familyTitleInput" placeholder="修改族谱名称">
                    <button onclick="changeFamilyTitle()">修改抬头</button>
                </div>
            </header>

            <div class="toolbar">
                <button onclick="addMember()">➕新增族人</button>
                <button onclick="exportJson()">💾导出备份(json)</button>
                <button onclick="importJson()">📥导入备份</button>
                <button onclick="exportPdf()">📄导出PDF</button>
                <button onclick="openKeySetting()">🔑修改秘钥</button>
            </div>

            <div class="main-row">
                <div class="form-card">
                    <h3>录入族人信息</h3>
                    <div class="form-item">
                        <label>姓名</label>
                        <input id="mName" placeholder="必填">
                    </div>
                    <div class="form-item">
                        <label>配偶</label>
                        <input id="mSpouse" placeholder="无则留空">
                    </div>
                    <div class="form-item">
                        <label>辈分称谓</label>
                        <input id="mTitle" placeholder="始祖/祖父等">
                    </div>
                    <div class="form-item">
                        <label>父辈数字ID（始祖留空）</label>
                        <input id="mFatherId" placeholder="只填数字，始祖不填">
                    </div>
                    <div class="form-item">
                        <label>生卒年份</label>
                        <input id="mLife" placeholder="例：1900‑1965">
                    </div>
                    <div class="form-item">
                        <label>生平备注</label>
                        <input id="mRemark" placeholder="事迹、迁居">
                    </div>
                    <button onclick="submitMember()">保存录入</button>
                    <div class="tip">💡录入完成会显示数字ID，子女直接填这个数字即可</div>
                </div>

                <div class="tree-wrap" id="treeContainer">
                    <div id="treeInner">
                        <div style="text-align:center;padding:40px 0;color:#66523c;">
                            请录入始祖开始建立族谱
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" class="hidden">

    <script>
        let appData = {
            secretKey:"zupu123",
            familyTitle:"帅氏族谱",
            nextId:1,
            memberList:[]
        };

        function loadStorage(){
            const s = localStorage.getItem("zupu_data");
            if(s){
                try{
                    appData = JSON.parse(s);
                }catch(e){
                    console.log("无旧数据");
                }
            }
        }
        function saveLocal(){
            localStorage.setItem("zupu_data",JSON.stringify(appData));
        }

        function checkSecretKey(){
            const pwd = document.getElementById("passInput").value.trim();
            if(pwd === appData.secretKey){
                document.getElementById("lockModal").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
                renderFamilyTitle();
                renderTree();
            }else{
                alert("秘钥错误");
            }
        }
        function openKeySetting(){
            const newKey = prompt("设置新访问秘钥",appData.secretKey);
            if(newKey && newKey.trim()){
                appData.secretKey = newKey.trim();
                saveLocal();
                alert("秘钥修改完成");
            }
        }
        function changeFamilyTitle(){
            const val = document.getElementById("familyTitleInput").value.trim();
            if(!val){alert("名称不能为空");return;}
            appData.familyTitle = val;
            saveLocal();
            renderFamilyTitle();
        }
        function renderFamilyTitle(){
            document.getElementById("familyTitle").innerText = appData.familyTitle;
            document.getElementById("familyTitleInput").value = appData.familyTitle;
            document.title = appData.familyTitle;
        }

        function addMember(){
            document.getElementById("mName").value="";
            document.getElementById("mSpouse").value="";
            document.getElementById("mTitle").value="";
            document.getElementById("mFatherId").value="";
            document.getElementById("mLife").value="";
            document.getElementById("mRemark").value="";
        }

        function submitMember(){
            const name = document.getElementById("mName").value.trim();
            if(!name){alert("姓名不能为空");return;}
            const fatherInput = document.getElementById("mFatherId").value.trim();
            const fatherId = fatherInput === "" ? "" : Number(fatherInput);

            const item = {
                id: appData.nextId++,
                name:name,
                spouse:document.getElementById("mSpouse").value.trim(),
                title:document.getElementById("mTitle").value.trim(),
                fatherId: fatherId,
                life:document.getElementById("mLife").value.trim(),
                remark:document.getElementById("mRemark").value.trim()
            };
            appData.memberList.push(item);
            saveLocal();
            renderTree();
            alert(`录入成功！本条数字ID：${item.id}`);
        }

        function delPerson(id){
            if(!confirm("确定删除该族人，下属子女也会丢失！"))return;
            function removeRecursive(pid){
                appData.memberList = appData.memberList.filter(m=>m.id!==pid);
                const children = appData.memberList.filter(x=>x.fatherId===pid);
                children.forEach(c=>removeRecursive(c.id));
            }
            removeRecursive(id);
            saveLocal();
            renderTree();
        }

        function renderTree(){
            const inner = document.getElementById("treeInner");
            const rootList = appData.memberList.filter(m=>m.fatherId==="" || m.fatherId===null);
            function buildNode(p){
                let html = `<div class="person-card">`;
                html += `<div class="couple-box">`;
                if(p.title) html +=`<strong>【${p.title}】</strong>`;
                html +=`<strong>${p.name}</strong>`;
                if(p.spouse) html +=`<span class="divider-heart">配</span><span>${p.spouse}</span>`;
                html +=`</div>`;
                if(p.life) html +=`<div>生卒：${p.life}</div>`;
                if(p.remark) html +=`<div>简介：${p.remark}</div>`;
                html +=`<div class="tip">数字ID:${p.id} <span class="del-btn" onclick="delPerson(${p.id})">【删除本条及后代】</span></div>`;
                html +=`</div>`;
                const kids = appData.memberList.filter(k=>k.fatherId===p.id);
                if(kids.length>0){
                    html +=`<div class="children">`;
                    kids.forEach(k=>html += buildNode(k));
                    html +=`</div>`;
                }
                return html;
            }
            let outHtml = "";
            rootList.forEach(r=>outHtml += buildNode(r));
            if(!outHtml){
                inner.innerHTML = `<div style="text-align:center;padding:40px 0;color:#66523c;">请录入始祖开始建立族谱</div>`;
            }else{
                inner.innerHTML = outHtml;
            }
        }

        function exportJson(){
            const text = JSON.stringify(appData,null,2);
            const blob = new Blob([text],{type:"application/json"});
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = appData.familyTitle+"_备份.json";
            a.click();
        }

        function importJson(){
            const fileDom = document.getElementById("fileInput");
            fileDom.onchange = function(e){
                const f = e.target.files[0];
                if(!f)return;
                const reader = new FileReader();
                reader.onload = function(ev){
                    try{
                        const data = JSON.parse(ev.target.result);
                        if(confirm("导入将覆盖当前所有数据，确定吗？")){
                            appData = data;
                            saveLocal();
                            renderFamilyTitle();
                            renderTree();
                            alert("导入成功");
                        }
                    }catch(err){
                        alert("文件解析失败，不是合法备份");
                    }
                };
                reader.readAsText(f);
            };
            fileDom.click();
        }

        async function exportPdf(){
            if(!window.jspdf || !window.html2canvas){
                alert("无网络，无法加载PDF组件，可导出JSON备份");
                return;
            }
            const {jsPDF} = window.jspdf;
            const dom = document.getElementById("treeContainer");
            alert("正在生成PDF，请等待");
            try{
                const canvas = await html2canvas(dom,{backgroundColor:"#f7efe0",scale:1.5,useCORS:false});
                const img = canvas.toDataURL("image/jpeg");
                const pdf = new jsPDF("p","mm","a4");
                const w = pdf.internal.pageSize.getWidth()-20;
                const h = pdf.internal.pageSize.getHeight()-20;
                const ratio = Math.min(w/canvas.width,h/canvas.height);
                pdf.addImage(img,"JPEG",10,10,canvas.width*ratio,canvas.height*ratio);
                pdf.save(appData.familyTitle+".pdf");
            }catch(err){
                console.error(err);
                alert("PDF导出出错，请使用JSON备份");
            }
        }

        loadStorage();
    </script>
</body>
</html>
